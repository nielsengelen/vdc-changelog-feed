name: Update feeds

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the top of the hour to be polite)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build feeds
        run: node build-feeds.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feeds
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update changelog feeds"
            git push
          fi
